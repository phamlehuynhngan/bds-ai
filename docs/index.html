<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BĐS AI – Định giá căn hộ TP.HCM</title>
<meta name="description" content="Bản đồ định giá căn hộ TP.HCM bằng học máy không gian, có giải thích từng yếu tố.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%233b2a14%22/%3E%3Ctext x=%2216%22 y=%2221%22 font-size=%2213%22 font-family=%22Arial%22 font-weight=%22700%22 fill=%22%23eca130%22 text-anchor=%22middle%22%3EAI%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap&subset=vietnamese" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<style>
:root{
  --paper:#fffdf8;--cream:#fcfaf4;--beige:#f4ede1;--line:#e4d9c6;--line-2:#efe7d9;
  --ink:#3b2a14;--ink-2:#5e4a31;--muted:#8c7a62;--gold:#b9853f;--gold-2:#eca130;--brown:#886d49;
  --pos:#b5502a;--neg:#3f7a5a;
  --shadow:0 10px 40px rgba(71,45,10,.14);--shadow-sm:0 2px 10px rgba(71,45,10,.12);
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;--top:64px;--pw:380px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--beige);color:var(--ink);font-family:var(--font);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit}
.top{position:fixed;inset:0 0 auto 0;height:var(--top);z-index:40;display:flex;align-items:center;gap:20px;padding:0 24px;background:var(--cream);border-bottom:1px solid var(--line)}
.logo{font-size:19px;font-weight:700;letter-spacing:.04em;white-space:nowrap}.logo b{color:var(--gold)}
.logo small{display:block;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);line-height:1.2}
.tabs{display:flex;background:var(--beige);border-radius:999px;padding:4px;margin-left:auto}
.tabs button{padding:7px 18px;font-size:13.5px;font-weight:500;color:var(--ink-2);border-radius:999px}
.tabs button.on{background:var(--paper);color:var(--ink);box-shadow:var(--shadow-sm)}
#map{position:fixed;top:var(--top);left:0;right:var(--pw);bottom:0}
.maplibregl-ctrl-attrib{font-size:10.5px}
/* bảng điều khiển lớp */
.layers{position:fixed;top:calc(var(--top) + 14px);left:14px;z-index:20;background:var(--paper);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;width:250px}
.layers summary{font-size:13px;font-weight:600;cursor:pointer;list-style:none;display:none}
.layers h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.layers label{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:3px 0;cursor:pointer}
.layers select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--cream);font-size:13px;margin:2px 0 8px}
.legend{margin-top:8px}
.legend .bar{height:8px;border-radius:4px}
.legend .ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:2px}
.legend .cap{font-size:11.5px;color:var(--ink-2);margin-top:2px}
.hint{position:fixed;bottom:18px;left:calc((100vw - var(--pw))/2);transform:translateX(-50%);z-index:20;background:var(--ink);color:#fff;font-size:13px;padding:8px 14px;border-radius:999px;box-shadow:var(--shadow);pointer-events:none;transition:opacity .4s;white-space:nowrap}
/* bảng định giá */
.panel{position:fixed;top:var(--top);right:0;bottom:0;width:var(--pw);z-index:30;background:var(--paper);border-left:1px solid var(--line);overflow:auto;padding:20px 20px 28px}
.panel h2{font-size:17px;font-weight:600;line-height:1.35}
.panel .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.sec{margin-top:18px}
.sec>h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:8px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.form label{font-size:12px;color:var(--ink-2);display:flex;flex-direction:column;gap:3px}
.form input,.form select{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--cream);font-size:13.5px;width:100%}
.form .full{grid-column:1/-1}
.result{margin-top:16px;padding:14px 16px;border-radius:12px;background:var(--beige)}
.result .big{font-size:28px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.result .big small{font-size:14px;font-weight:500;color:var(--ink-2)}
.result .tot{font-size:14px;color:var(--ink-2);margin-top:4px}
.result .rng{font-size:12px;color:var(--muted);margin-top:4px}
.why .row{display:grid;grid-template-columns:1fr 120px 46px;align-items:center;gap:8px;font-size:12.5px;padding:3px 0}
.why .nm{color:var(--ink-2);line-height:1.3}
.why .trk{position:relative;height:10px}
.why .trk:before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line)}
.why .b{position:absolute;top:0;height:10px;border-radius:3px}
.why .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.why .note{font-size:11.5px;color:var(--muted);margin-top:6px}
.ev{font-size:13px;color:var(--ink-2)}
.ev b{color:var(--ink)}
.empty{color:var(--muted);font-size:13.5px;padding:14px;border:1px dashed var(--line);border-radius:12px;margin-top:16px}
.disc{font-size:11.5px;color:var(--muted);margin-top:20px;border-top:1px solid var(--line-2);padding-top:12px}
/* trang mô hình */
.page{position:fixed;inset:var(--top) 0 0 0;z-index:35;background:var(--cream);overflow:auto;display:none}
.page.on{display:block}
.page .wrap{max-width:860px;margin:0 auto;padding:32px 24px 60px}
.page h1{font-size:24px;font-weight:700;line-height:1.3}
.page h2{font-size:17px;font-weight:600;margin:28px 0 8px}
.page p,.page li{color:var(--ink-2);max-width:72ch}
.page ul{padding-left:20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:18px}
.kpi{background:var(--paper);border:1px solid var(--line-2);border-radius:12px;padding:14px}
.kpi .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-size:24px;font-weight:700;margin-top:2px}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13.5px;background:var(--paper);border-radius:12px;overflow:hidden}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line-2)}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--beige)}
td.n{text-align:right;font-variant-numeric:tabular-nums}
tr.best td{font-weight:600}
.imp .row{display:grid;grid-template-columns:260px 1fr 48px;gap:10px;align-items:center;font-size:13px;padding:3px 0}
.imp .b{height:12px;border-radius:3px;background:var(--gold)}
.imp .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
@media (max-width:820px){
  :root{--pw:0px;--top:56px}
  .top{padding:0 14px}.logo small{display:none}.tabs button{padding:6px 12px}
  #map{right:0;bottom:46vh}
  .panel{top:auto;height:46vh;width:100%;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:var(--shadow)}
  .layers{width:210px;padding:8px 12px}.layers summary{display:block}.layers[open] summary{margin-bottom:6px}
  .hint{bottom:calc(46vh + 12px);left:50%}
  .imp .row{grid-template-columns:150px 1fr 40px}
}
</style>
</head>
<body>
<header class="top">
  <div class="logo">BĐS <b>AI</b><small>Định giá căn hộ TP.HCM bằng học máy</small></div>
  <nav class="tabs"><button class="on" data-t="map">Bản đồ giá</button><button data-t="model">Mô hình</button></nav>
</header>

<div id="map"></div>

<details class="layers" id="layers" open>
  <summary>Lớp bản đồ</summary>
  <h4>Tô bản đồ theo</h4>
  <select id="mode"></select>
  <label><input type="checkbox" id="lyListings" checked> Tin rao thực tế</label>
  <label><input type="checkbox" id="lyProjects" checked> Dự án chủ đầu tư lớn</label>
  <label><input type="checkbox" id="lyMetro" checked> Metro số 1</label>
  <div class="legend"><div class="bar" id="lgBar"></div><div class="ticks" id="lgTicks"></div><div class="cap" id="lgCap"></div></div>
</details>
<div class="hint" id="hint">Bấm vào bất kỳ điểm nào trên bản đồ để định giá</div>

<aside class="panel" id="panel">
  <h2 id="pTitle">Định giá căn hộ</h2>
  <div class="sub" id="pSub">Chọn một điểm trên bản đồ hoặc một dự án.</div>
  <div class="sec">
    <h3>Thông tin căn hộ</h3>
    <div class="form">
      <label>Diện tích (m²)<input id="fSize" type="number" min="20" max="300" value="70"></label>
      <label>Phòng ngủ<select id="fRooms"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label>
      <label>Nhà vệ sinh<select id="fToilets"><option>1</option><option selected>2</option><option>3</option></select></label>
      <label>Nội thất<select id="fFurn"><option value="1">Cao cấp</option><option value="2" selected>Đầy đủ</option><option value="3">Hoàn thiện cơ bản</option><option value="4">Bàn giao thô</option></select></label>
      <label>Pháp lý<select id="fLegal"><option value="6">Sổ hồng riêng</option><option value="5">Hợp đồng mua bán</option><option value="2">Đang chờ sổ</option></select></label>
      <label>Tình trạng<select id="fStatus"><option value="2">Đã bàn giao</option><option value="1">Chưa bàn giao</option></select></label>
    </div>
  </div>
  <div id="out"><div class="empty">Chưa chọn vị trí. Bấm lên bản đồ để xem giá dự đoán và lý do.</div></div>
  <div class="disc" id="disc"></div>
</aside>

<section class="page" id="pgModel"><div class="wrap" id="modelWrap"></div></section>

<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script>
const V="?v=202611171500";
const $=s=>document.querySelector(s);
const fmt=(x,d=1)=>x.toLocaleString("vi-VN",{minimumFractionDigits:d,maximumFractionDigits:d});
const LABEL={size:"Diện tích",rooms:"Số phòng ngủ",toilets:"Số nhà vệ sinh",furnishing_sell:"Nội thất",
  property_legal_document:"Pháp lý",property_status:"Tình trạng bàn giao",apartment_type:"Loại căn hộ",
  d_center:"Khoảng cách tới trung tâm (Bến Thành)",d_metro:"Khoảng cách tới ga Metro số 1",
  n_edu_1km:"Số trường học trong 1 km",n_health_1km:"Số cơ sở y tế trong 1 km",n_shop_1km:"Số siêu thị, TTTM trong 1 km",n_park_1km:"Số công viên trong 1 km",
  d_edu:"Khoảng cách tới trường gần nhất",d_health:"Khoảng cách tới cơ sở y tế gần nhất",d_shop:"Khoảng cách tới siêu thị, TTTM gần nhất",d_park:"Khoảng cách tới công viên gần nhất",
  lat:"Vị trí cụ thể (toạ độ)",lon:"Vị trí cụ thể (toạ độ)"};
const PRICE_STOPS=[30,45,60,80,110,150,220],PRICE_COL=["#f3e7c9","#ecc98a","#e0a55a","#cf7a3a","#b5502a","#8c2f22","#5c1a1a"];
const EFF_STOPS=[-40,-20,-5,0,5,20,40],EFF_COL=["#2f6b4f","#6fa585","#cfe1d3","#f6f1e6","#f1cfb1","#d98a5c","#a6402a"];
const KM_LON=111.32*Math.cos(10.8*Math.PI/180);
const dist=(a,b,c,d)=>Math.hypot((a-c)*111.32,(b-d)*KM_LON);
let M,TREES,POI,METRO,PRJ,LIST,F,pick=null;

/* ---------- mô hình trong trình duyệt ---------- */
function features(lat,lon){
  const f={lat,lon,d_center:dist(lat,lon,10.77251,106.69802)};
  let dm=1e9,ns=null;for(const s of METRO.stations){const d=dist(lat,lon,s[1],s[2]);if(d<dm){dm=d;ns=s[0];}}f.d_metro=dm;f._station=ns;
  for(const k of ["edu","health","shop","park"]){let n=0,m=1e9;for(const p of POI){if(p[2]!==k)continue;const d=dist(lat,lon,p[0],p[1]);if(d<1)n++;if(d<m)m=d;}f["n_"+k+"_1km"]=n;f["d_"+k]=m;}
  return f;}
function apt(){return{size:+$("#fSize").value||70,rooms:+$("#fRooms").value,toilets:+$("#fToilets").value,furnishing_sell:+$("#fFurn").value,
  property_legal_document:+$("#fLegal").value,property_status:+$("#fStatus").value,apartment_type:1};}
function explain(x){ // Saabas: đóng góp theo đường quyết định của từng cây
  const c=new Array(F.length).fill(0);let bias=0,y=0;
  for(const t of TREES){let n=t;bias+=Array.isArray(t)?t[4]:t;
    while(Array.isArray(n)){const nx=x[n[0]]<=n[1]?n[2]:n[3];c[n[0]]+=(Array.isArray(nx)?nx[4]:nx)-n[4];n=nx;}y+=n;}
  return{y,bias,c};}

/* ---------- định giá tại điểm ---------- */
function value(){
  if(!pick)return;
  const sf=features(pick.lat,pick.lon),a=apt(),x=F.map(k=>k in a?a[k]:sf[k]);
  const {y,bias,c}=explain(x),p=Math.exp(y),tot=p*a.size/1000,err=M.results.at(-1)["MAPE_%"]/100;
  // gộp lat+lon
  const items=[];F.forEach((k,i)=>{if(k==="lon")return;let v=c[i];if(k==="lat")v+=c[F.indexOf("lon")];items.push([LABEL[k],v]);});
  items.sort((u,v)=>Math.abs(v[1])-Math.abs(u[1]));const top=items.slice(0,7),mx=Math.max(...top.map(t=>Math.abs(Math.exp(t[1])-1)),.05);
  const near=LIST.filter(l=>dist(pick.lat,pick.lon,l[0],l[1])<1).map(l=>l[2]).sort((u,v)=>u-v);
  const med=near.length?near[Math.floor(near.length/2)]:null;
  $("#out").innerHTML=`
  <div class="result"><div class="big">${fmt(p)} <small>triệu/m²</small></div>
    <div class="tot">≈ <b>${fmt(tot,2)} tỷ</b> cho căn ${a.size} m²</div>
    <div class="rng">Khoảng tham khảo ${fmt(p*(1-err))}–${fmt(p*(1+err))} triệu/m² (± sai số trung bình ${fmt(err*100)}%)</div></div>
  <div class="sec why"><h3>Vì sao có mức giá này</h3>
    ${top.map(([n,v])=>{const e=(Math.exp(v)-1)*100,w=Math.min(50,Math.abs(e)/(mx*100)*50);
      return`<div class="row"><div class="nm">${n}</div><div class="trk"><div class="b" style="${e>=0?`left:50%;background:var(--pos)`:`right:50%;background:var(--neg)`};width:${w}%"></div></div><div class="v" style="color:${e>=0?"var(--pos)":"var(--neg)"}">${e>=0?"+":""}${fmt(e,0)}%</div></div>`;}).join("")}
    <div class="note">So với mức giá nền ${fmt(Math.exp(bias))} triệu/m² (trung bình toàn bộ dữ liệu). Đóng góp tính theo đường quyết định của 400 cây LightGBM.</div></div>
  <div class="sec"><h3>Đối chiếu tin rao thực tế</h3><div class="ev">${near.length?`Trong bán kính 1 km có <b>${near.length}</b> tin rao, trung vị <b>${fmt(med)} triệu/m²</b>.`:"Không có tin rao nào trong bán kính 1 km — dự đoán ở đây kém tin cậy hơn."}</div></div>`;
  $("#pSub").textContent=`Cách Bến Thành ${fmt(sf.d_center)} km · ga Metro gần nhất: ${sf._station} (${fmt(sf.d_metro)} km)`;
}
function setPick(lat,lon,title){pick={lat,lon};$("#pTitle").textContent=title||"Điểm đã chọn";
  M_map.getSource("pick").setData({type:"Feature",geometry:{type:"Point",coordinates:[lon,lat]}});$("#hint").style.opacity=0;value();}
["#fSize","#fRooms","#fToilets","#fFurn","#fLegal","#fStatus"].forEach(s=>$(s).addEventListener("input",value));

/* ---------- lớp bản đồ ---------- */
const MODES=[["p","Giá dự đoán (triệu/m²)"],["d_metro","Ảnh hưởng của Metro số 1"],["d_center","Ảnh hưởng khoảng cách trung tâm"],["amen","Ảnh hưởng tiện ích xung quanh"],["loc","Ảnh hưởng vị trí cụ thể"]];
function gridFC(){const h=0.00225,ix=k=>F.indexOf(k),amen=F.filter(k=>/_(edu|health|shop|park)/.test(k)).map(ix);
  return{type:"FeatureCollection",features:M.grid.map(g=>{const s=g.s,e=v=>Math.round((Math.exp(v)-1)*1000)/10;
    return{type:"Feature",properties:{p:g.p,d_metro:e(s[ix("d_metro")]),d_center:e(s[ix("d_center")]),amen:e(amen.reduce((a,i)=>a+s[i],0)),loc:e(s[ix("lat")]+s[ix("lon")])},
      geometry:{type:"Polygon",coordinates:[[[g.lon-h,g.lat-h],[g.lon+h,g.lat-h],[g.lon+h,g.lat+h],[g.lon-h,g.lat+h],[g.lon-h,g.lat-h]]]}};})};}
function step(prop,stops,cols){const e=["interpolate",["linear"],["get",prop]];stops.forEach((s,i)=>e.push(s,cols[i]));return e;}
function setMode(m){const price=m==="p",stops=price?PRICE_STOPS:EFF_STOPS,cols=price?PRICE_COL:EFF_COL;
  M_map.setPaintProperty("grid","fill-color",step(m,stops,cols));
  $("#lgBar").style.background=`linear-gradient(90deg,${cols.join(",")})`;
  $("#lgTicks").innerHTML=stops.map(s=>`<span>${price?s:(s>0?"+":"")+s+"%"}</span>`).join("");
  $("#lgCap").textContent=price?`Căn tham chiếu ${M.ref.size} m², ${M.ref.rooms} PN · triệu đồng/m²`:"Mức tăng/giảm giá so với giá nền (SHAP)";}

let M_map;
async function boot(){
  const j=u=>fetch("data/"+u+V).then(r=>r.json());
  [M,TREES,POI,METRO,PRJ,LIST]=await Promise.all(["model.json","trees.json","poi.json","metro.json","projects.json","listings.json"].map(j));
  F=M.features;
  $("#mode").innerHTML=MODES.map(([k,n])=>`<option value="${k}">${n}</option>`).join("");
  $("#disc").innerHTML=`Mô hình học từ <b>${M.n.toLocaleString("vi-VN")}</b> tin rao bán căn hộ (${M.collected}). Giá tin rao là giá chào bán, không phải giá giao dịch. Kết quả chỉ để tham khảo cho nghiên cứu.`;
  renderModel();
  M_map=new maplibregl.Map({container:"map",style:"https://tiles.openfreemap.org/styles/positron",center:[106.71,10.79],zoom:11.3,attributionControl:false});
  M_map.addControl(new maplibregl.AttributionControl({compact:true,customAttribution:"Dữ liệu tin rao: Chợ Tốt Nhà"}));
  M_map.addControl(new maplibregl.NavigationControl({showCompass:false}),"bottom-right");
  M_map.on("load",()=>{
    const first=M_map.getStyle().layers.find(l=>l.type==="symbol")?.id;
    M_map.addSource("grid",{type:"geojson",data:gridFC()});
    M_map.addLayer({id:"grid",type:"fill",source:"grid",paint:{"fill-opacity":["interpolate",["linear"],["zoom"],10,.62,15,.35],"fill-outline-color":"rgba(255,255,255,.25)"}},first);
    M_map.addSource("metro",{type:"geojson",data:{type:"FeatureCollection",features:[{type:"Feature",geometry:{type:"LineString",coordinates:METRO.line}},
      ...METRO.stations.map(s=>({type:"Feature",properties:{n:"Ga "+s[0]},geometry:{type:"Point",coordinates:[s[2],s[1]]}}))]}});
    M_map.addLayer({id:"metro-l",type:"line",source:"metro",filter:["==","$type","LineString"],paint:{"line-color":"#1c75bc","line-width":3}});
    M_map.addLayer({id:"metro-s",type:"circle",source:"metro",filter:["==","$type","Point"],paint:{"circle-radius":4.5,"circle-color":"#fff","circle-stroke-color":"#1c75bc","circle-stroke-width":2}});
    M_map.addSource("ls",{type:"geojson",data:{type:"FeatureCollection",features:LIST.map(l=>({type:"Feature",properties:{p:l[2],s:l[3],n:l[4]||""},geometry:{type:"Point",coordinates:[l[1],l[0]]}}))}});
    M_map.addLayer({id:"ls",type:"circle",source:"ls",paint:{"circle-radius":["interpolate",["linear"],["zoom"],10,1.6,15,4.5],"circle-color":step("p",PRICE_STOPS,PRICE_COL),"circle-stroke-color":"#3b2a14","circle-stroke-width":.6,"circle-opacity":.95}});
    M_map.addSource("pj",{type:"geojson",data:{type:"FeatureCollection",features:PRJ.projects.map(p=>({type:"Feature",properties:{n:p.n,c:PRJ.dev[p.d]?.c||"#3b2a14",d:PRJ.dev[p.d]?.n||""},geometry:{type:"Point",coordinates:[p.ll[1],p.ll[0]]}}))}});
    M_map.addLayer({id:"pj",type:"circle",source:"pj",paint:{"circle-radius":6,"circle-color":["get","c"],"circle-stroke-color":"#fff","circle-stroke-width":2}});
    M_map.addLayer({id:"pj-t",type:"symbol",source:"pj",minzoom:12.5,layout:{"text-field":["get","n"],"text-size":11.5,"text-offset":[0,1.1],"text-anchor":"top","text-font":["Noto Sans Regular"]},paint:{"text-color":"#3b2a14","text-halo-color":"#fff","text-halo-width":1.4}});
    M_map.addSource("pick",{type:"geojson",data:{type:"FeatureCollection",features:[]}});
    M_map.addLayer({id:"pick",type:"circle",source:"pick",paint:{"circle-radius":9,"circle-color":"rgba(0,0,0,0)","circle-stroke-color":"#3b2a14","circle-stroke-width":3}});
    setMode("p");
    M_map.on("click",e=>{const f=M_map.queryRenderedFeatures(e.point,{layers:["pj"]})[0];
      if(f){const [lon,lat]=f.geometry.coordinates;setPick(lat,lon,f.properties.n);$("#pSub").insertAdjacentHTML("afterbegin",`Chủ đầu tư: ${f.properties.d}<br>`);}
      else setPick(e.lngLat.lat,e.lngLat.lng);});
    for(const l of ["pj","ls"]){M_map.on("mouseenter",l,()=>M_map.getCanvas().style.cursor="pointer");M_map.on("mouseleave",l,()=>M_map.getCanvas().style.cursor="");}
    const pop=new maplibregl.Popup({closeButton:false,offset:8});
    M_map.on("mousemove","ls",e=>{const p=e.features[0].properties;pop.setLngLat(e.lngLat).setHTML(`<b>${fmt(+p.p)} triệu/m²</b> · ${p.s} m²${p.n?`<br>${p.n}`:""}`).addTo(M_map);});
    M_map.on("mouseleave","ls",()=>pop.remove());
  });
}
$("#mode").onchange=e=>setMode(e.target.value);
const vis=(ids,on)=>ids.forEach(i=>M_map.setLayoutProperty(i,"visibility",on?"visible":"none"));
$("#lyListings").onchange=e=>vis(["ls"],e.target.checked);
$("#lyProjects").onchange=e=>vis(["pj","pj-t"],e.target.checked);
$("#lyMetro").onchange=e=>vis(["metro-l","metro-s"],e.target.checked);
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));$("#pgModel").classList.toggle("on",b.dataset.t==="model");});

/* ---------- trang mô hình ---------- */
function renderModel(){
  const R=M.results,best=R.at(-1),base=R[0],imp=[];const seen={};
  M.importance.forEach(([k,v])=>{const n=LABEL[k];if(seen[n]!==undefined){imp[seen[n]][1]+=v;return;}seen[n]=imp.length;imp.push([n,v]);});
  imp.sort((a,b)=>b[1]-a[1]);const mx=imp[0][1];
  $("#modelWrap").innerHTML=`
  <h1>Đặc trưng không gian giảm sai số định giá từ ${fmt(base["MAPE_%"])}% xuống ${fmt(best["MAPE_%"])}%</h1>
  <p style="margin-top:8px">Mô hình LightGBM học giá/m² căn hộ TP.HCM từ ${M.n.toLocaleString("vi-VN")} tin rao (lọc từ ${M.n_raw.toLocaleString("vi-VN")} tin thô), dùng khoảng cách tới Metro, trung tâm và mật độ tiện ích lấy từ OpenStreetMap.</p>
  <div class="kpis"><div class="kpi"><div class="k">Sai số MAPE</div><div class="v">${fmt(best["MAPE_%"])}%</div></div>
    <div class="kpi"><div class="k">Sai số MAE</div><div class="v">${fmt(best.MAE_trieu_m2)} <small style="font-size:13px">tr/m²</small></div></div>
    <div class="kpi"><div class="k">R²</div><div class="v">${best.R2.toLocaleString("vi-VN")}</div></div>
    <div class="kpi"><div class="k">Số tin dùng</div><div class="v">${M.n.toLocaleString("vi-VN")}</div></div></div>
  <h2>So sánh mô hình</h2>
  <p>Kiểm định chéo 5 phần, chia theo ô lưới ~2 km để căn hộ sát nhau không nằm cả ở tập huấn luyện lẫn tập kiểm tra.</p>
  <table><thead><tr><th>Mô hình</th><th class="n">MAPE (%)</th><th class="n">MAE (triệu/m²)</th><th class="n">R²</th></tr></thead>
  <tbody>${R.map(r=>`<tr class="${r===best?"best":""}"><td>${r.model}</td><td class="n">${fmt(r["MAPE_%"])}</td><td class="n">${fmt(r.MAE_trieu_m2)}</td><td class="n">${r.R2.toLocaleString("vi-VN")}</td></tr>`).join("")}</tbody></table>
  <h2>Yếu tố ảnh hưởng nhiều nhất (SHAP)</h2>
  <p>Mức ảnh hưởng trung bình của từng yếu tố lên log giá/m², tính bằng SHAP trên toàn bộ dữ liệu.</p>
  <div class="imp">${imp.map(([n,v])=>`<div class="row"><div>${n}</div><div><div class="b" style="width:${v/mx*100}%"></div></div><div class="v">${v.toFixed(3)}</div></div>`).join("")}</div>
  <h2>Dữ liệu và phương pháp</h2>
  <ul>
    <li><b>Giá:</b> tin rao bán căn hộ TP.HCM trên Chợ Tốt Nhà (API công khai), thu thập 11/2026, không lưu thông tin người đăng.</li>
    <li><b>Làm sạch:</b> giữ diện tích 20–300 m², giá 15–400 triệu/m²; bỏ tin trùng; bỏ ngoại lai lệch quá xa trung vị phường.</li>
    <li><b>Đặc trưng không gian:</b> khoảng cách tới Bến Thành và ga Metro số 1; số trường học, cơ sở y tế, siêu thị/TTTM, công viên trong 1 km và khoảng cách tới điểm gần nhất (OpenStreetMap).</li>
    <li><b>Giải thích:</b> SHAP cho lớp bản đồ; với căn hộ do người dùng nhập, trình duyệt tính đóng góp theo đường quyết định của từng cây (phương pháp Saabas, xấp xỉ SHAP).</li>
  </ul>
  <h2>Hạn chế</h2>
  <ul>
    <li>Giá chào bán thường cao hơn giá giao dịch; tin rao chỉ phản ánh thời điểm thu thập nên chưa đo được tác động theo thời gian của Metro.</li>
    <li>Toạ độ tin rao do người đăng chọn, có thể lệch; khu vực ít tin rao cho dự đoán kém tin cậy.</li>
  </ul>`;
}
if(matchMedia("(max-width:820px)").matches)$("#layers").open=false;
boot();
</script>
